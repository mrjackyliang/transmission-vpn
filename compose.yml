name: transmission-vpn

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      TZ: "${TZ:-UTC}"
    ports:
      - "${TRANSMISSION_VPN_PORT:-22602}:22602"
      - "${TRANSMISSION_VPN_PROXY_PORT:-22605}:22605"
      - "${TRANSMISSION_VPN_RPC_PORT:-9091}:9091"
    restart: unless-stopped
    volumes:
      - config:/config
      - data:/data

networks:
  default:
    enable_ipv6: true

volumes:
  config:
  data:
