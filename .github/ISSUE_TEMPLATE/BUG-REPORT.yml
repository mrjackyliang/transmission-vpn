name: "Bug Report"
description: "Found an unexpected issue or problem? Report it here."
title: "[Bug]: "
labels: [ "bug" ]
body:
  - type: "markdown"
    attributes:
      value: "I truly appreciate you taking the time to share this bug report with me."
  - type: "markdown"
    attributes:
      value: "Please __fill out the form with as much detail as possible__ so I can recreate the problem."
  - type: "markdown"
    attributes:
      value: "---"
  - type: "checkboxes"
    id: "pre-check"
    attributes:
      label: "Bug Report Confirmation"
      description: "Confirm that this submission belongs in the bug report form."
      options:
        - label: "I have provided a descriptive title and kept the original title prefix, __\"[Bug]: \"__"
          required: true
        - label: "I searched open and closed issues and did not find the same problem"
          required: true
        - label: "I have read the [documentation](https://mrjackyliang.github.io/transmission-vpn/), and this is __NOT__ a duplicate bug report"
          required: true
        - label: "I am reporting behavior that is not working as documented or intended"
          required: true
  - type: "input"
    id: "email"
    attributes:
      label: "Your email address"
      description: "Help me easily get in touch with you if I need more information. __If possible, please consider using an alias you have access to, as this information is publicly visible.__"
      placeholder: "e.g. user@example.com"
    validations:
      required: true
  - type: "textarea"
    id: "steps-to-reproduce"
    attributes:
      label: "Steps to Reproduce"
      description: "List the shortest sequence that shows the problem. Include setup details that affect the result."
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: "textarea"
    id: "expected-behavior"
    attributes:
      label: "Expected Behavior"
      description: "Describe the result you expected after following those steps."
    validations:
      required: true
  - type: "textarea"
    id: "actual-behavior"
    attributes:
      label: "Actual Behavior"
      description: "Describe what happened instead. Include the exact error text when available."
    validations:
      required: true
  - type: "input"
    id: "affected-version"
    attributes:
      label: "Affected Version or Date"
      description: "Enter the affected version. If no version is visible, enter the date the problem was observed."
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: "dropdown"
    id: "frequency"
    attributes:
      label: "Frequency"
      description: "Select how consistently the problem occurs."
      options:
        - "Every Time"
        - "Often"
        - "Sometimes"
        - "Once"
        - "Not Sure"
    validations:
      required: true
  - type: "input"
    id: "docker-version"
    attributes:
      label: "Docker Version"
      description: "Enter the complete version shown by `docker version`."
      placeholder: "e.g. 29.2.1"
    validations:
      required: true
  - type: "input"
    id: "compose-version"
    attributes:
      label: "Docker Compose Version"
      description: "Enter the Docker Compose version when Compose is used."
      placeholder: "e.g. 2.40.3"
    validations:
      required: false
  - type: "input"
    id: "host-os"
    attributes:
      label: "Host Operating System"
      description: "Enter the host operating system and version."
      placeholder: "e.g. Ubuntu 24.04, Debian 13, macOS 26"
    validations:
      required: true
  - type: "input"
    id: "architecture"
    attributes:
      label: "Host Architecture"
      description: "Enter the host architecture."
      placeholder: "e.g. amd64, arm64"
    validations:
      required: true
  - type: "input"
    id: "image-reference"
    attributes:
      label: "Image Reference"
      description: "Enter the image name and tag or digest that showed the problem."
      placeholder: "e.g. example/app:1.0.0"
    validations:
      required: true
  - type: "textarea"
    id: "deployment"
    attributes:
      label: "Deployment Configuration"
      description: "Paste only the affected service or command. __Remove all secrets and private data before submitting.__"
      render: "Shell"
    validations:
      required: true
  - type: "input"
    id: "affected-url"
    attributes:
      label: "Affected URL or Route"
      description: "Enter the affected public URL or route. Use only the route when the hostname is private."
      placeholder: "e.g. /settings"
    validations:
      required: false
  - type: "dropdown"
    id: "browser"
    attributes:
      label: "Browser"
      description: "Select the affected browser."
      options:
        - "Google Chrome"
        - "Mozilla Firefox"
        - "Apple Safari"
        - "Microsoft Edge"
        - "Other"
    validations:
      required: false
  - type: "input"
    id: "browser-version"
    attributes:
      label: "Browser Version"
      description: "Enter the complete browser version."
      placeholder: "e.g. 145.0.7632.75"
    validations:
      required: false
  - type: "input"
    id: "viewport-size"
    attributes:
      label: "Viewport Size"
      description: "Enter the viewport width and height when layout affects the problem."
      placeholder: "e.g. 390 x 844"
    validations:
      required: false
  - type: "textarea"
    id: "screenshots"
    attributes:
      label: "Screenshot"
      description: "Attach a screenshot when it helps show the problem. __Remove personal and confidential information first.__"
    validations:
      required: false
  - type: "input"
    id: "notification-service"
    attributes:
      label: "Notification Service"
      description: "Enter the notification service involved. Leave this empty when the submission is unrelated to notifications."
    validations:
      required: false
  - type: "input"
    id: "notification-event"
    attributes:
      label: "Notification Event"
      description: "Enter the event that should send or did send the notification."
    validations:
      required: false
  - type: "dropdown"
    id: "vpn-provider"
    attributes:
      label: "VPN Provider"
      description: "Select the provider of the affected VPN connection."
      options:
        - "PureVPN"
        - "Private Internet Access"
        - "IPVanish"
        - "NordVPN"
        - "Surfshark"
        - "IVPN"
        - "Mullvad"
        - "Custom"
        - "Not Applicable"
    validations:
      required: true
  - type: "dropdown"
    id: "vpn-protocol"
    attributes:
      label: "VPN Protocol"
      description: "Select the protocol of the affected VPN connection."
      options:
        - "OpenVPN"
        - "WireGuard"
        - "Not Applicable"
    validations:
      required: true
  - type: "dropdown"
    id: "affected-area"
    attributes:
      label: "Affected Area"
      description: "Select the Transmission VPN area involved."
      options:
        - "Torrent Management"
        - "Torrent Profile"
        - "VPN Connection"
        - "VPN Provider or Endpoint"
        - "Fail-Closed Protection"
        - "Web Proxy"
        - "Remote App Access"
        - "Settings"
        - "Notifications"
        - "Container Startup or Health"
        - "Other"
    validations:
      required: true
  - type: "dropdown"
    id: "protection-state"
    attributes:
      label: "Protection State"
      description: "Select the protection state displayed when the problem occurred."
      options:
        - "Protected"
        - "Partially Protected"
        - "Connecting"
        - "Blocked"
        - "Setup Required"
        - "Not Sure"
    validations:
      required: false
  - type: "textarea"
    id: "logs"
    attributes:
      label: "Relevant Logs"
      description: "Paste the relevant failure output when available. __Remove all secrets and personal data before submitting.__ This block is formatted as code, so there is no need for backticks."
      render: "Shell"
    validations:
      required: false
  - type: "textarea"
    id: "additional-context"
    attributes:
      label: "Additional Context"
      description: "Add any other information that could help explain the submission."
    validations:
      required: false
  - type: "checkboxes"
    id: "legal"
    attributes:
      label: "Legal Agreements"
      description: "By submitting a new bug report, you confirm that you have read, understood, and agree to the [Terms of Use](https://mrjackyliang.github.io/mrjackyliang/terms/) and [Privacy Policy](https://mrjackyliang.github.io/mrjackyliang/privacy/). If you have questions, please contact my team."
      options:
        - label: "I agree to the Terms of Use and Privacy Policy"
          required: true
